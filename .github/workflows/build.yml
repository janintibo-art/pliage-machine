name: Compiler APK et EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check web/press3d.js && node --check web/press3d-ui.js && node --check web/fold3d.js && node --check web/fold3d-ui.js && node --check web/flat.js && node --check web/flat-ui.js && node --check web/webgl.js && node --check web/catalog.js && node --check web/app.js && node --check web/engine.js && node --check desktop/main.js && npm test
  android:
    name: APK Android
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug --stacktrace
      - name: Préparer le fichier APK versionné
        id: apk
        shell: bash
        run: |
          version=$(sed -nE 's/.*versionCode ([0-9]+).*/\1/p' android/app/build.gradle)
          [[ "$version" =~ ^[0-9]+$ ]] || exit 1
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk "output/Pliage-Machine-v${version}.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Pliage-Machine-APK-v${{ steps.apk.outputs.version }}
          path: output/Pliage-Machine-v${{ steps.apk.outputs.version }}.apk
          if-no-files-found: error
  windows:
    name: EXE Windows
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Identifier le fichier EXE configuré
        id: exe
        shell: pwsh
        run: |
          $file = (Get-Content package.json -Raw | ConvertFrom-Json).build.portable.artifactName
          if ($file -notmatch '^Pliage-Machine-v[0-9]+\.exe$') { throw "Nom EXE inattendu : $file" }
          if (!(Test-Path -LiteralPath "dist/$file" -PathType Leaf)) { throw "EXE absent : dist/$file" }
          "file=$file" >> $env:GITHUB_OUTPUT
          "name=$($file -replace '^Pliage-Machine-', 'Pliage-Machine-EXE-' -replace '\.exe$', '')" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.exe.outputs.name }}
          path: dist/${{ steps.exe.outputs.file }}
          if-no-files-found: error
